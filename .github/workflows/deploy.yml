name: Deploy til GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Oppdater fotballodds"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut kode
        uses: actions/checkout@v4

      - name: Sett opp Bun
        uses: oven-sh/setup-bun@v2

      - name: Installer avhengigheter
        run: bun install

      - name: Bygg Astro-siden
        run: bun run build

      - name: Last opp bygg-output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
